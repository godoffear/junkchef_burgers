<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заполнение демо-данных</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b35;
            margin-bottom: 20px;
        }
        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #ff6b35;
            color: white;
        }
        .btn-primary:hover {
            background: #e85a27;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .success {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🍔 Burger Shop — Демо-данные</h1>

    <div class="info">
        <strong>ℹ️ Что это?</strong><br>
        Эта страница заполнит приложение примерами данных за неделю для демонстрации всех функций.
        <br><br>
        <strong>Будут добавлены:</strong>
        <ul>
            <li>✅ Продажи за 7 дней</li>
            <li>✅ Пример расходов товаров</li>
            <li>✅ Остатки на складе</li>
            <li>✅ История смен</li>
        </ul>
    </div>

    <button class="btn-primary" onclick="loadDemoData()">
        📊 Заполнить демо-данные
    </button>

    <button class="btn-secondary" onclick="clearAllData()">
        🗑 Очистить данные
    </button>

    <button class="btn-secondary" onclick="goToApp()">
        🏠 Вернуться в приложение
    </button>

    <div class="success" id="success">
        ✅ Демо-данные загружены! Откройте приложение →
    </div>
</div>

<script>
const STORAGE_KEY_WEEK = 'burgerShop_week_';
const STORAGE_KEY_INVENTORY = 'burgerShop_inventory';

function getWeekKey() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    const diff = now - start;
    const week = Math.ceil((diff / 86400000 + start.getDay() + 1) / 7);
    return now.getFullYear() + '-W' + week;
}

function loadDemoData() {
    // Пример продаж за неделю
    const demoSales = {
        // Понедельник (немного, не выходной)
        [getDate(-6)]: [
            { recipe_id: 'burger_classic', quantity: 15 },
            { recipe_id: 'burger_double', quantity: 5 },
            { recipe_id: 'fries', quantity: 20 }
        ],
        // Вторник
        [getDate(-5)]: [
            { recipe_id: 'burger_classic', quantity: 18 },
            { recipe_id: 'burger_double', quantity: 6 },
            { recipe_id: 'burger_vegan', quantity: 3 },
            { recipe_id: 'fries', quantity: 22 }
        ],
        // Среда
        [getDate(-4)]: [
            { recipe_id: 'burger_classic', quantity: 12 },
            { recipe_id: 'burger_double', quantity: 4 },
            { recipe_id: 'burger_vegan', quantity: 2 },
            { recipe_id: 'fries', quantity: 18 }
        ],
        // Четверг
        [getDate(-3)]: [
            { recipe_id: 'burger_classic', quantity: 14 },
            { recipe_id: 'burger_double', quantity: 5 },
            { recipe_id: 'burger_vegan', quantity: 3 },
            { recipe_id: 'fries', quantity: 20 }
        ],
        // Пятница (начало выходных)
        [getDate(-2)]: [
            { recipe_id: 'burger_classic', quantity: 35 },
            { recipe_id: 'burger_double', quantity: 15 },
            { recipe_id: 'burger_vegan', quantity: 8 },
            { recipe_id: 'fries', quantity: 45 }
        ],
        // Суббота (выходной)
        [getDate(-1)]: [
            { recipe_id: 'burger_classic', quantity: 42 },
            { recipe_id: 'burger_double', quantity: 18 },
            { recipe_id: 'burger_vegan', quantity: 10 },
            { recipe_id: 'fries', quantity: 55 }
        ],
        // Воскресенье
        [getDate(0)]: [
            { recipe_id: 'burger_classic', quantity: 38 },
            { recipe_id: 'burger_double', quantity: 16 },
            { recipe_id: 'burger_vegan', quantity: 9 },
            { recipe_id: 'fries', quantity: 50 }
        ]
    };

    // Сохраняем продажи
    const weekKey = getWeekKey();
    localStorage.setItem(STORAGE_KEY_WEEK + weekKey, JSON.stringify(demoSales));

    // Обновляем остатки (как если бы товары уже потратили)
    const demoInventory = {
        'Булка бургерная': { current: 100, min: 80, max: 200, unit: 'шт' },
        'Фарш мяса (говядина)': { current: 4.5, min: 5, max: 15, unit: 'кг' },
        'Огурец свежий': { current: 1.2, min: 2, max: 6, unit: 'кг' },
        'Помидор свежий': { current: 0.8, min: 2, max: 5, unit: 'кг' },
        'Листья салата': { current: 0.6, min: 1, max: 3, unit: 'кг' },
        'Грибы (шампиньоны, обжаренные)': { current: 1.2, min: 1, max: 4, unit: 'кг' },
        'Авокадо': { current: 0.4, min: 0.5, max: 3, unit: 'кг' },
        'Картофель свежий': { current: 3, min: 5, max: 20, unit: 'кг' },
        'Масло растительное': { current: 2.5, min: 2, max: 10, unit: 'л' },
        'Соль, специи': { current: 0.8, min: 0.5, max: 2, unit: 'кг' },
        'Соус (майонез+кетчуп)': { current: 1.5, min: 1, max: 5, unit: 'л' },
        'Соус (веган)': { current: 0.8, min: 0.5, max: 3, unit: 'л' },
        'Упаковка (бумага, коробка)': { current: 120, min: 200, max: 500, unit: 'шт' },
        'Упаковка (большая коробка)': { current: 75, min: 100, max: 300, unit: 'шт' },
        'Бумажный пакет': { current: 95, min: 100, max: 400, unit: 'шт' },
        'Бумажные салфетки': { current: 1.2, min: 1.5, max: 5, unit: 'уп' },
        'Средство для уборки': { current: 1.2, min: 1, max: 3, unit: 'л' }
    };

    localStorage.setItem(STORAGE_KEY_INVENTORY, JSON.stringify(demoInventory));

    // Показываем успех
    document.getElementById('success').style.display = 'block';

    // Перенаправляем через 2 секунды
    setTimeout(() => {
        window.location.href = 'index.html';
    }, 2000);
}

function clearAllData() {
    if (confirm('⚠️ Очистить ВСЕ данные приложения?')) {
        const weekKey = getWeekKey();
        localStorage.removeItem(STORAGE_KEY_WEEK + weekKey);
        localStorage.removeItem(STORAGE_KEY_INVENTORY);
        localStorage.removeItem('burgerShop_currentShift');
        alert('✅ Данные очищены');
        window.location.href = 'index.html';
    }
}

function goToApp() {
    window.location.href = 'index.html';
}

function getDate(daysOffset) {
    const date = new Date();
    date.setDate(date.getDate() + daysOffset);
    return date.toISOString().split('T')[0];
}
</script>
</body>
</html>
